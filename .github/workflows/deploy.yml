name: 🚀 Build and Deploy

on:
  push:
    branches:
      - development
      - production
      - staging

permissions:
  contents: read
  packages: write

env:
  GHCR_OWNER: face-mychange
  IMAGE_REPO: mychange-backend-server
  IMAGE_TAG: ${{ github.ref_name }}
  SERVICE_NAME: api
  COMPOSE_PATH: /home/devops/apps/services/${{ github.ref_name }}-MgityChangeBackend/compose.yaml

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Deploy
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -e

          # Both commands seamlessly get the IMAGE_TAG from the step env block above
          docker compose -f ${{ env.COMPOSE_PATH }} pull ${{ env.SERVICE_NAME }}

          docker compose -f ${{ env.COMPOSE_PATH }} up -d --no-deps ${{ env.SERVICE_NAME }}

          docker image prune -f

          echo "🚀 ${{ env.SERVICE_NAME }} restarted successfully!"
