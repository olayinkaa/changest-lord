# Schemas owned by the user module. Referenced from paths/users.yaml.

User:
  type: object
  description: Canonical user record returned by the user module.
  properties:
    id:
      type: string
      format: uuid
      example: 8b1f3c0e-2c1f-4f2a-9b6e-1b1f4e6d2f1a
    email:
      type: string
      format: email
      nullable: true
    phone:
      type: string
      nullable: true
      example: "+2348012345678"
    firstName:
      type: string
      nullable: true
    lastName:
      type: string
      nullable: true
    userType:
      type: string
      enum: [customer, merchant, agent]
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
